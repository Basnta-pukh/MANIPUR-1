<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manipur 1</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f3;
      color: #18352b;
    }

    header {
      background: #145c42;
      color: white;
      padding: 25px 18px;
      border-radius: 0 0 28px 28px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 55px;
      height: 55px;
      border-radius: 17px;
      background: white;
      color: #145c42;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
    }

    .logo h1 {
      font-size: 27px;
    }

    .logo p {
      font-size: 13px;
      margin-top: 3px;
      opacity: 0.85;
    }

    .search {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
    }

    main {
      padding: 25px 16px;
    }

    h2 {
      margin-bottom: 16px;
    }

    .categories {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 15px;
      margin-bottom: 30px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      flex: 0 0 155px;
      height: 155px;
      background: white;
      border-radius: 24px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
      border: 1px solid #e1e7e2;
      box-shadow: 0 7px 20px rgba(0,0,0,0.07);

      font-size: 16px;
      font-weight: bold;
    }

    .icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .place {
      background: white;
      padding: 18px;
      border-radius: 18px;
      margin-bottom: 14px;
      box-shadow: 0 5px 16px rgba(0,0,0,0.05);
    }

    .place h3 {
      margin-bottom: 8px;
    }

    .place p {
      color: #68766e;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      <div class="logo-mark">1</div>

      <div>
        <h1>Manipur 1</h1>
        <p>One app. One Manipur.</p>
      </div>
    </div>

    <input
      class="search"
      type="search"
      placeholder="Search Manipur..."
    >

  </header>

  <main>

    <h2>Explore Manipur</h2>

    <div class="categories">

      <div class="category">
        <div class="icon">🏔️</div>
        Tourism
      </div>

      <div class="category">
        <div class="icon">🍽️</div>
        Food
      </div>

      <div class="category">
        <div class="icon">🚗</div>
        Transport
      </div>

      <div class="category">
        <div class="icon">🏢</div>
        Businesses
      </div>

      <div class="category">
        <div class="icon">🎓</div>
        Student Hub
      </div>

      <div class="category">
        <div class="icon">💼</div>
        Jobs
      </div>

    </div>

    <h2>Discover Manipur</h2>

    <div class="place">
      <h3>Explore Places</h3>
      <p>Discover beautiful places, culture and experiences across Manipur.</p>
    </div>

    <div class="place">
      <h3>Local Food</h3>
      <p>Discover local food and restaurants.</p>
    </div>

  </main>

<script>
  const categories = document.querySelectorAll(".category");

  categories.forEach(function(category) {

    category.addEventListener("click", function() {

      alert("You selected " + category.innerText.trim());

    });

  });
</script>
<script>
  const navItems = document.querySelectorAll(".nav-item");

  navItems.forEach(function(item) {
    item.addEventListener("click", function() {

      navItems.forEach(function(nav) {
        nav.classList.remove("active");
      });

      item.classList.add("active");

      alert("Opening " + item.innerText.trim());
    });
  });
</script>
  
</body>
</html>
